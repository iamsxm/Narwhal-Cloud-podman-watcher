name: Build and Release Rust Client

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-client:
    name: Build Rust Client (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: narwhal-client-linux-amd64
            cross: false
          - target: aarch64-unknown-linux-musl
            artifact_name: narwhal-client-linux-arm64
            cross: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (amd64)
        if: ${{ !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for ARM64)
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Native AMD64 Musl
        if: ${{ !matrix.cross }}
        working-directory: ./client-rust
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/narwhal-client ../${{ matrix.artifact_name }}

      - name: Build Cross ARM64 Musl
        if: ${{ matrix.cross }}
        working-directory: ./client-rust
        run: |
          cross build --locked --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/narwhal-client ../${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release Binaries
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Read Version
        id: version
        shell: bash
        run: echo "val=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Files
        run: |
          mkdir -p release_assets
          cp ./dist/narwhal-client-linux-amd64/narwhal-client-linux-amd64 release_assets/
          cp ./dist/narwhal-client-linux-arm64/narwhal-client-linux-arm64 release_assets/
          chmod +x release_assets/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ steps.version.outputs.val }}"
          name: "Narwhal Monitor v${{ steps.version.outputs.val }}"
          draft: false
          prerelease: false
          files: |
            release_assets/narwhal-client-linux-amd64
            release_assets/narwhal-client-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
