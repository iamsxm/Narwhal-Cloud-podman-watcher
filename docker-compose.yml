services:
  narwhal-server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.6.25"
    image: narwhal-monitor-server:latest
    container_name: narwhal-monitor-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
