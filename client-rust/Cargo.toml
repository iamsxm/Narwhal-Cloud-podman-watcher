[package]
name = "narwhal-client"
version = "1.6.33"
edition = "2021"
rust-version = "1.83"
authors = ["iamsxm"]
description = "Lightweight Rust client for Narwhal Cloud Container Watcher"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json", "tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
